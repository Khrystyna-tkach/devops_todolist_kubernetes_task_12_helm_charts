apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-headless
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app:  mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    statefulset.kubernetes.io/pod-name: {{ .Chart.Name }}-statefulset-0
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
# pod-name.service-name.namespace.svc.cluster.local
# pod-name.service-name
# mysql-0.mysql.mysql.svc.cluster.local